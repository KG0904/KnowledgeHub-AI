services:   
    go-gateway:
        build: ./backend/go-gateway
        image: go-gateway
        container_name: go-gateway
        ports:
            - "8080:8080"
        volumes:
            - ../knowledgehub-uploads:/app/uploads
        depends_on:
            - postgres
            - redis
    
    python-ai-service:
        build: ./backend/python-ai-service
        image: python-ai-service
        container_name: python-ai-service
        ports:
            - "8000:8000"
        volumes:
            - ../knowledgehub-uploads:/app/uploads
        depends_on:
            - qdrant
    
    postgres:
        image: postgres:17
        container_name: postgres
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password123
            POSTGRES_DB: userdb
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis:
        image: redis:8
        container_name: redis
        ports:
            - "6379:6379"
    
    qdrant:
        image: qdrant/qdrant:latest
        container_name: qdrant
        ports:
            - "6333:6333"
        volumes:
            - qdrant-data:/qdrant/storage

volumes:
    postgres-data:
    qdrant-data: